name: DevSecOps CI/CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    sast-scan:
        name: Semgrep SAST Scan
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Run Semgrep SAST
              run: semgrep scan --config auto --error --verbose --exclude=".github"

    pylint-check:
        name: Pylint Code Quality Gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pylint
                  pip install -r requirements.txt

            - name: Run Pylint Check
              run: pylint --fail-under=9.0 app.py

    unit-test:
        name: Pytest Unit Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pytest pytest-cov -r requirements.txt

            - name: Run Pytest with Coverage
              run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

    dependency-scan:
        name: Pip-Audit Dependency Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Run Pip-Audit
              run: |
                  pip install pip-audit
                  pip-audit -r requirements.txt

    image-scan:
        name: Trivy Image Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Build Image
              run: docker build -t secure-flask-app:scan .

            - name: Run Trivy
              run: |
                  docker run --rm \
                      -v /var/run/docker.sock:/var/run/docker.sock \
                      aquasec/trivy:latest image \
                      --severity CRITICAL,HIGH \
                      --ignore-unfixed \
                      --exit-code 1 \
                      secure-flask-app:scan

    secret-scan:
        name: Gitleaks Secret Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    deploy-to-vm:
        name: Build & Deploy to VirtualBox VM
        needs: [sast-scan, pylint-check, unit-test, dependency-scan, image-scan, secret-scan]
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Build and Run Container
              run: |
                  docker build -t secure-flask-app:latest .
                  docker stop web-flask || true
                  docker rm web-flask || true
                  docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest
                  docker ps | grep web-flask

            - name: Smoke Test (Health Check)
              run: |
                  for i in $(seq 1 15); do
                      if curl --fail --silent http://localhost:5000/health; then
                          echo "Aplikasi sehat"
                          exit 0
                      fi
                      echo "Menunggu aplikasi siap ($i/15)..."
                      sleep 2
                  done
                  echo "Smoke test gagal. Log container:"
                  docker logs web-flask
                  exit 1